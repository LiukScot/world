name: Release

# Publishes the production image to GHCR on every push to main. The server's
# Watchtower polls that image and restarts the container on its own.
# ponytail: no CI gate here — main is only reached through PRs that CI already
# ran on. Gate with `workflow_run` if direct pushes to main ever start happening.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v3.x

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6.x
        with:
          context: .
          push: true
          # :latest is what the server follows; the sha tag is the rollback handle.
          tags: |
            ghcr.io/liukscot/world:latest
            ghcr.io/liukscot/world:${{ github.sha }}
          # Links the package to this repo on GHCR, which is also what makes the
          # package inherit the repo's public visibility.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
