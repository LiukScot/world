name: iOS

# Builds the device app as an unsigned IPA. Signing happens outside CI, so no
# certificate is stored here.
on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unsigned IPA
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.x
        with:
          bun-version: 1.4.2

      # The device build bundles the backend sources, which resolve their
      # imports from backend/node_modules.
      - name: Install backend deps
        working-directory: backend
        run: bun install --frozen-lockfile

      - name: Install frontend deps
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build the device bundle
        working-directory: frontend
        run: bunx vite build

      # Copies the bundle and the Capacitor config into ios/; both are gitignored.
      - name: Sync into the Xcode project
        working-directory: frontend
        run: bunx cap sync ios

      - name: Archive without signing
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qr World-unsigned.ipa Payload

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # An IPA is already a zip; uploading it as-is downloads the .ipa
          # itself instead of a zip that wraps it.
          archive: false
          path: World-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
