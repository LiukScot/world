services:
  world:
    build: .
    image: world:local
    container_name: world
    ports:
      - "5555:5555"
    mem_limit: 512m
    cpus: "0.5"
    user: "1000:1000"
    environment:
      HOST: 0.0.0.0
      PORT: 5555
      DB_PATH: /app/data/world.sqlite
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5555,http://127.0.0.1:5555,http://localhost:5173,http://127.0.0.1:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "--eval", "const r=await fetch('http://localhost:5555/api/v1/auth/session');process.exit(r.ok?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
