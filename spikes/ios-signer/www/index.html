<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>World spike</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);
      }
      button { font-size: 1rem; padding: 12px 16px; margin: 4px 4px 4px 0; }
      #rows { font-size: 2rem; font-weight: 700; }
      pre { white-space: pre-wrap; background: #f0f0f0; padding: 8px; font-size: 0.8rem; }
    </style>
  </head>
  <body>
    <h1>World persistence spike</h1>
    <p>Rows in the database: <span id="rows">…</span></p>
    <button id="add" type="button">Add 1 row</button>
    <button id="bulk" type="button">Add 20,000 rows</button>
    <button id="reset" type="button">Delete the file</button>
    <pre id="log" aria-live="polite"></pre>
    <script src="sql-wasm.js"></script>
    <script src="spike.js"></script>
  </body>
</html>
